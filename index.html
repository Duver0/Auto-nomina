<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="docs/manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234CAF50'%3E%3Cpath d='M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z'/%3E%3C/svg%3E" type="image/svg+xml">
  <meta name="theme-color" content="#1a5f2a">
  <title>Descargar Nómina - PSP</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
</head>
<body>
  <div class="container">
<div class="icon" id="iconContainer">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    </div>

    <h1>Descarga de Nómina</h1>
    <p class="subtitle">Ingrese su contraseña</p>

    <form class="password-form" id="passwordForm" onsubmit="return verificarPassword(event)">
      <input
        type="password"
        class="password-input"
        id="passwordInput"
        placeholder="Contraseña"
        autocomplete="off"
      >
      <p class="error-msg" id="errorMsg">Contraseña incorrecta</p>
      <button type="submit" class="submit-btn">Acceder</button>
    </form>

    <div class="files" id="filesContainer">

      <!-- Pensión 1 -->
      <div class="group">
        <span class="group-label">Pensión 1</span>
        <div class="group-btns">
          <a id="btn-nomina1" href="#" class="file-btn colilla-btn" download>
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <div class="file-btn-text">
              <span class="file-btn-label">Colilla de:</span>
              <span class="file-btn-period" id="period-nomina1">Abril</span>
            </div>
          </a>
          <a id="btn-prima1" href="#" class="file-btn prima-btn" download style="display:none">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <div class="file-btn-text">
              <span class="file-btn-label">Prima de:</span>
              <span class="file-btn-period" id="period-prima1">Abril</span>
            </div>
          </a>
        </div>
      </div>

      <div class="group-sep"></div>

      <!-- Pensión 2 -->
      <div class="group">
        <span class="group-label">Pensión 2</span>
        <div class="group-btns">
          <a id="btn-nomina2" href="#" class="file-btn colilla-btn" download>
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <div class="file-btn-text">
              <span class="file-btn-label">Colilla de:</span>
              <span class="file-btn-period" id="period-nomina2">Abril</span>
            </div>
          </a>
          <a id="btn-prima2" href="#" class="file-btn prima-btn" download style="display:none">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <div class="file-btn-text">
              <span class="file-btn-label">Prima de:</span>
              <span class="file-btn-period" id="period-prima2">Abril</span>
            </div>
          </a>
        </div>
      </div>

      <div class="group-sep"></div>

      <!-- Retroactivo -->
      <div class="group">
        <span class="group-label">Retroactivo</span>
        <div class="group-btns">
          <a id="btn-retroactivo" href="#" class="file-btn retroactivo" download style="display:none">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <div class="file-btn-text">
              <span class="file-btn-title" id="title-retroactivo">Retroactivo Pensionados</span>
            </div>
          </a>
          <p id="retroactivo-empty" class="retroactivo-empty" style="display:none;font-size:12px;color:#999;width:100%;">No disponible este período</p>
        </div>
      </div>

    </div>

    <button type="button" class="history-toggle" id="historyToggle" style="display:none">
      <span class="history-toggle-text">📂 Ver meses anteriores</span>
      <svg class="history-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
    </button>

    <div class="history" id="historyContainer" style="display:none"></div>

    <div class="info" id="infoContainer" style="display: none;">
      Actualización automática cada lunes
    </div>

    <p class="footer">Portal PSP · Policía Nacional</p>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('SW registrado'))
        .catch(err => console.log('SW error:', err));
    }

    function extraerMes(filename, prefix) {
      // e.g. "nomina1-abril-2026.pdf" with prefix "nomina1" → "Abril"
      const re = new RegExp('^' + prefix + '-(.+)\\.pdf$');
      const m = filename.match(re);
      if (!m) return '';
      return m[1].split('-')[0].replace(/\b\w/g, c => c.toUpperCase());
    }

    const TIPOS = [
      { key: 'nomina1',     btnId: 'btn-nomina1',     periodId: 'period-nomina1' },
      { key: 'nomina2',     btnId: 'btn-nomina2',     periodId: 'period-nomina2' },
      { key: 'prima1',      btnId: 'btn-prima1',      periodId: 'period-prima1' },
      { key: 'prima2',      btnId: 'btn-prima2',      periodId: 'period-prima2' },
      { key: 'retroactivo', btnId: 'btn-retroactivo', periodId: null },
    ];

    function aplicarMes(periodo) {
      // periodo: { mes, nomina1, nomina2, prima1, prima2, retroactivo }
      for (const t of TIPOS) {
        const filename = periodo[t.key];
        const btn = document.getElementById(t.btnId);
        if (!btn) continue;
        if (filename) {
          btn.href = 'docs/downloads/' + filename;
          btn.setAttribute('download', filename);
          if (t.periodId) {
            const p = document.getElementById(t.periodId);
            if (p) p.textContent = extraerMes(filename, t.key);
          }
          btn.style.display = 'flex';
        } else {
          btn.style.display = 'none';
        }
      }
      const retroEl = document.getElementById('retroactivo-empty');
      if (retroEl) retroEl.style.display = periodo.retroactivo ? 'none' : 'block';
    }

    const ICONO = '<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>';

    function crearBoton(tipo, filename, history) {
      const a = document.createElement('a');
      a.href = 'docs/downloads/' + filename;
      a.setAttribute('download', filename);
      a.className = 'file-btn history-btn ' + (tipo === 'retroactivo' ? 'retroactivo' : (tipo.includes('prima') ? 'prima-btn' : 'colilla-btn'));
      a.innerHTML = ICONO +
        '<div class="file-btn-text">' +
          '<span class="file-btn-label">' + (tipo === 'retroactivo' ? 'Retroactivo' : (tipo.includes('prima') ? 'Prima' : 'Colilla')) + '</span>' +
        '</div>';
      return a;
    }

    function crearMesHistorial(periodo) {
      const wrap = document.createElement('div');
      wrap.className = 'history-month';

      const head = document.createElement('div');
      head.className = 'history-month-label';
      head.textContent = periodo.mes;
      wrap.appendChild(head);

      const grupos = [
        { label: 'Pensión 1', tipos: ['nomina1', 'prima1'] },
        { label: 'Pensión 2', tipos: ['nomina2', 'prima2'] },
        { label: 'Retroactivo', tipos: ['retroactivo'] },
      ];

      for (const g of grupos) {
        const gWrap = document.createElement('div');
        gWrap.className = 'group';
        const gLabel = document.createElement('span');
        gLabel.className = 'group-label';
        gLabel.textContent = g.label;
        gWrap.appendChild(gLabel);
        const btns = document.createElement('div');
        btns.className = 'group-btns';
        let alguno = false;
        for (const tipo of g.tipos) {
          const f = periodo[tipo];
          if (f) { btns.appendChild(crearBoton(tipo, f, true)); alguno = true; }
        }
        if (alguno) gWrap.appendChild(btns);
        wrap.appendChild(gWrap);
      }
      return wrap;
    }

    function construirHistorial(historial) {
      const toggle = document.getElementById('historyToggle');
      const cont = document.getElementById('historyContainer');
      if (!historial || !historial.length) {
        window.__tieneHistorial = false;
        return;
      }
      window.__tieneHistorial = true;
      cont.innerHTML = '';
      for (const periodo of historial) {
        cont.appendChild(crearMesHistorial(periodo));
      }

      toggle.addEventListener('click', () => {
        const abierto = cont.style.display === 'block';
        cont.style.display = abierto ? 'none' : 'block';
        toggle.classList.toggle('open', !abierto);
        toggle.querySelector('.history-toggle-text').textContent =
          abierto ? '📂 Ver meses anteriores' : '📂 Ocultar meses anteriores';
      });
    }

    function aplicarManifesto(manifest) {
      if (manifest.actual) aplicarMes(manifest.actual);
      construirHistorial(manifest.historial);
    }

    fetch('docs/downloads/manifest.json?t=' + Date.now())
      .then(r => r.json())
      .then(aplicarManifesto)
      .catch(() => {
        // Fallback: colillas with static links
        const n1 = document.getElementById('btn-nomina1');
        const n2 = document.getElementById('btn-nomina2');
        n1.href = 'docs/downloads/nomina1-agosto-2026.pdf';
        n2.href = 'docs/downloads/nomina2-agosto-2026.pdf';
        n1.style.display = 'flex';
        n2.style.display = 'flex';
      });
  </script>

</body>
</html>
